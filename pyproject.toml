[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usleep-rbdpd"
version = "1.0.1"
description = "U-Sleep for automated sleep staging in RBD and Parkinson's Disease populations"
authors = [{ name = "Jesper Strøm", email = "js@ece.au.dk" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # Install PyTorch *before* running `pip install .` to get the correct
    # CPU/GPU variant — see README for instructions.
    "numpy>=1.26",
    "matplotlib>=3.7",
    "CSDP @ git+https://github.com/jesperstroem/CSDP.git@github_checkout",
    "ml-architectures @ git+https://github.com/RuneSchroeder/ml_architectures.git",
]

[project.urls]
repository = "https://github.com/jesperstroem/U-Sleep-for-RBD-PD"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
